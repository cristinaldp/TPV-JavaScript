<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPV · Frutería La Huerta</title>
  <link rel="stylesheet" href="estilos.css">
  <!-- PASO 1: enlazar aquí datos.js y app.js, los dos con defer y en ese orden -->
  <script src="datos.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="cabecera">
    <h1>Frutería La Huerta · TPV</h1>
    <div class="ajustes">
      <button class="tema">Tema oscuro</button>
      <button class="letra-menos">A−</button>
      <button class="letra-mas">A+</button>
    </div>
  </header>

  <main class="tpv">
    <section class="catalogo">
      <h2>Productos</h2>
      <div class="filtros">
        <button data-categoria="todas" class="activo">Todas</button>
        <button data-categoria="fruta">Fruta</button>
        <button data-categoria="verdura">Verdura</button>
        <button data-categoria="frutos secos">Frutos secos</button>
        <input class="buscar" placeholder="Buscar por nombre">
      </div>
      <p class="detalle">Click en un producto para ver su detalle</p>
      <div class="productos"></div>
    </section>

    <aside class="ticket">
      <h2>Ticket</h2>
      <form class="venta-codigo">
        <label>Código <input class="codigo" type="number"></label>
        <button>Añadir</button>
      </form>
      <p class="aviso"></p>
      <ul class="lineas"></ul>
      <p class="total">Total: 0.00 €</p>
      <button class="cobrar">Cobrar</button>
      <button class="vaciar">Vaciar ticket</button>
    </aside>
  </main>
  <section class="ventas">
    <h2>Ventas del día</h2>
    <p class="resumen-ventas">Sin ventas todavía</p>
  </section>
</body>
</html>
